name: Release demo offline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test demo offline
        run: dotnet run --project tests/PosDemo.Tests -c Release
      - name: Build Windows and Linux packages
        run: python3 scripts/package_cross_platform.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/POS-Desktop-linux-x64.tar.gz \
            artifacts/POS-Desktop-win-x64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "MiKuGoMi POS Demo Offline ${GITHUB_REF_NAME}" \
            --notes-file distribution/RELEASE-NOTES-DEMO.md
